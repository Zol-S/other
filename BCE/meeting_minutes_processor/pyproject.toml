[project]
name = "jacob"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zoltán Balogh", email = "zoltan.balogh@sogelink.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.125.0",
    "bs4>=0.0.2",
    "ipykernel>=7.3.0",
    "langchain>=1.3.16",
    "langchain-openai>=1.6.0",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sacremoses>=0.2.0",
    "tqdm>=4.70.0",
]

[project.scripts]
jacob = "jacob:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
